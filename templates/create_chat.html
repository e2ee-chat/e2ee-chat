{% extends 'base.html' %}
{% block main %}
<div class="max-w-lg mx-auto px-2 mt-2 mb-8">
  <div class="flex items-center gap-1.5 font-semibold mb-5">
    <a href="{{ url_for('home') }}" class="btn btn-ghost btn-circle">
      <span class="icon icon-arrow-back"></span>
    </a>Create chat
  </div>
  <form method="post" class="border border-base-300 p-5 rounded-box" data-clear-clipboard>
    <p class="text-sm text-base-content/60">
      Save the chat name and private key in your password manager.
      The private key is available only on this page.
    </p>
    <label for="name" class="form-label mt-4">Chat name</label>
    <input type="text" id="name" name="name" value="{{ name }}" class="input" readonly>
    <button type="button" data-copy-target="name" class="btn mt-1.5">
      Copy chat name
    </button>
    <label for="private_key" class="form-label mt-4">Private key</label>
    <input type="password" id="private_key" value="{{ private_key }}" class="input" readonly
      spellcheck="false" autocorrect="off" autocapitalize="none" autocomplete="off"
    >
    <button type="button" data-copy-target="private_key" class="btn mt-1.5">
      Copy private key
    </button>
    <label for="public_key" class="form-label mt-4">Public key</label>
    <textarea name="public_key" id="public_key" class="textarea" readonly>{{ public_key }}</textarea>
    <button type="submit" class="btn btn-primary mt-5">Create chat</button>
  </form>
</div>
{% endblock %}
