{% extends 'base.html' %}
{% block main %}
<div class="max-w-lg mx-auto px-2 mt-2 mb-8">
  <div class="flex justify-between items-center mb-5">
    <div class="flex items-center gap-1.5 font-semibold">
      <a href="{{ url_for('home') }}" class="btn btn-ghost btn-circle">
        <span class="icon icon-arrow-left"></span>
      </a>{{ name }}
    </div>
    <div class="dropdown dropdown-end">
      <div tabindex="0" role="button" class="btn btn-ghost btn-circle">
        <span class="icon icon-more"></span>
      </div>
      <ul tabindex="-1" class="dropdown-content menu bg-base-100 rounded-box border border-base-300
        z-1 w-52 mt-1.5 shadow-md"
      >
        <li><button onclick="delete_chat_modal.showModal()">Delete chat</button></li>
      </ul>
    </div>
  </div>
  <form method="post" class="border border-base-300 p-5 rounded-box" data-clear-clipboard>
    <p class="text-sm text-base-content/60">
      Send your public key to the other party.
      Paste the public key received from the other party.
    </p>
    <label for="public_key" class="form-label mt-4">Public key</label>
    <textarea id="public_key" class="textarea break-all resize-none" readonly>{{ public_key }}</textarea>
    <button type="button" data-copy-target="public_key" class="btn mt-1.5">
      Copy public key
    </button>
    <label for="peer_public_key" class="form-label mt-4">Peer public key</label>
    <textarea name="peer_public_key" id="peer_public_key" class="textarea break-all resize-none"
      autocomplete="off" required
    ></textarea>
    <button type="submit" class="btn btn-primary mt-5">Set peer public key</button>
  </form>
</div>
<dialog id="delete_chat_modal" class="modal">
  <div class="modal-box">
    <h3 class="text-lg font-semibold mb-5">Delete chat</h3>
    <p>Are you sure you want to delete chat {{ name }}?</p>
    <div class="modal-action justify-between mt-8">
      <form method="dialog">
        <button class="btn">Cancel</button>
      </form>
      <form action="{{ url_for('delete_chat', name=name) }}" method="post">
        <button class="btn btn-error">Delete chat</button>
      </form>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop"><button></button></form>
</dialog>
{% endblock %}
