{% extends 'base.html' %}
{% block main %}
<div class="max-w-6xl mx-auto px-2 py-1">
  <div class="flex justify-between items-center">
    <div class="text-lg font-semibold">E2EE Chat</div>
    <div class="flex items-center gap-1.5">
      <button id="theme-button" class="btn btn-sm btn-circle btn-ghost" title="Toggle theme">
        <span class="icon icon-muted icon-hover"></span>
      </button>
      <a href="https://github.com/e2ee-chat/e2ee-chat" target="_blank"
        class="btn btn-sm btn-circle btn-ghost" title="GitHub"
      >
        <span class="icon icon-github icon-lg icon-muted icon-hover"></span>
      </a>
    </div>
  </div>
</div>
<div class="max-w-100 mx-auto px-2 mt-1 mb-8">
  <div class="flex justify-center">
    <a href="{{ url_for('create_chat') }}" class="btn btn-lg">Create chat</a>
  </div>
  {% if chats %}
  <ul class="list bg-base-100 rounded-box border border-base-300/50 mt-4">
    <li class="px-4 pt-2 pb-1 text-xs text-base-content/50 font-mono tracking-wider">Chats</li>
    {% for name, number in chats %}
    <li>
      <a href="{{ url_for('chat', name=name) }}" class="list-row list-row-chat">
        <div>
          <div class="text-lg font-semibold">{{ name }}</div>
          <div class="text-sm text-base-content/50 mt-1">
            {{ number }} {% if number == 1 %}message{% else %}messages{% endif %}
          </div>
        </div>
      </a>
    </li>
    {% endfor %}
  </ul>
  {% endif %}
</div>
{% endblock %}
