{% extends 'base.html' %}
{% block main %}
<div class="max-w-3xl mx-auto px-2 py-1">
  <div class="flex justify-between items-center">
    <div class="text-lg font-semibold">E2EE Chat</div>
    <a href="https://github.com/e2ee-chat/e2ee-chat" target="_blank"
      class="btn btn-sm btn-circle btn-link group" title="GitHub"
    >
      <span class="icon icon-github bg-base-content/70! group-hover:bg-base-content!"></span>
    </a>
  </div>
</div>
<div class="max-w-sm mx-auto px-2 mt-2 mb-8">
  <div class="flex justify-center mb-4">
    <a href="{{ url_for('create_chat') }}" class="btn btn-lg">Create chat</a>
  </div>
  {% for name, number in chats %}
  <a href="{{ url_for('chat', name=name) }}" class="card border border-base-300 bg-base-100 mb-2
    shadow-xs hover:bg-base-200/90 hover:shadow-md transition duration-200 ease-out overflow-hidden
    focus-visible:outline-solid focus-visible:outline-2 active:bg-base-200/70 active:shadow-xs"
  >
    <div class="card-body">
      <h2 class="card-title">{{ name }}</h2>
      <p class="text-sm text-base-content/50">
        {{ number }} {% if number == 1 %}message{% else %}messages{% endif %}
      </p>
    </div>
  </a>
  {% endfor %}
</div>
{% endblock %}
